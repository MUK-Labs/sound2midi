name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/*.test.mjs
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare headless Linux audio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=sound2midi_ci
          pactl set-default-sink sound2midi_ci
          pactl set-default-source sound2midi_ci.monitor
          pactl info
      - run: python -m pip install -r requirements.txt
      - run: python -c "import sounddevice, mido, rtmidi"
      - run: python -m unittest discover -v
      - run: python system_audio_midi.py --help
      - run: bash -n Start.command
